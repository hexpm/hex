name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  format:
    name: Format
    # A pull request from a branch in this repository tests the same commit
    # as the branch's push, so only pull requests from forks run here.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OTP and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: 28.5
          elixir-version: 1.19.5
          version-type: strict

      - name: Install dependencies
        run: mix deps.get

      - name: Check mix format
        run: mix format --check-formatted

  test:
    name: Test
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        pair:
          # - erlang: maint
          #   elixir: main
          - erlang: "29.0"
            elixir: 1.20.2
          - erlang: 28.5
            elixir: 1.19.5
          - erlang: 27.3
            elixir: 1.17.3
          - erlang: 26.2
            elixir: 1.16.1
          - erlang: 25.3
            elixir: 1.15.7
          - erlang: 25.3
            elixir: 1.14.5
          - erlang: 25.3
            elixir: 1.13.4
          - erlang: 24.3
            elixir: 1.12.3

    env:
      HEXPM_OTP: OTP-29.0.5
      HEXPM_ELIXIR: v1.20.3
      HEXPM_BRANCH: main
      HEXPM_PATH: hexpm
      HEXPM_ELIXIR_PATH: hexpm_elixir
      HEXPM_OTP_PATH: hexpm_otp
      HEXPM_MIX_HOME: hexpm_mix
      HEXPM_MIX_ARCHIVES: hexpm_mix

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OTP and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{matrix.pair.erlang}}
          elixir-version: ${{matrix.pair.elixir}}
          version-type: strict

      - name: Install OTP and Elixir for hexpm
        run: |
          wget https://repo.hex.pm/builds/otp/ubuntu-22.04/${HEXPM_OTP}.tar.gz
          mkdir -p ${HEXPM_OTP_PATH}
          tar -xf ${HEXPM_OTP}.tar.gz -C ${HEXPM_OTP_PATH} --strip-components=1
          ${HEXPM_OTP_PATH}/Install -minimal $(pwd)/${HEXPM_OTP_PATH}
          wget https://repo.hex.pm/builds/elixir/${HEXPM_ELIXIR}.zip
          unzip -d ${HEXPM_ELIXIR_PATH} ${HEXPM_ELIXIR}.zip
          mkdir -p ${HEXPM_MIX_HOME}
          PATH=$(pwd)/${HEXPM_ELIXIR_PATH}/bin:$(pwd)/${HEXPM_OTP_PATH}/bin:${PATH} MIX_HOME=$(pwd)/${HEXPM_MIX_HOME} MIX_ARCHIVES=$(pwd)/${HEXPM_MIX_HOME} mix local.hex --force
          PATH=$(pwd)/${HEXPM_ELIXIR_PATH}/bin:$(pwd)/${HEXPM_OTP_PATH}/bin:${PATH} MIX_HOME=$(pwd)/${HEXPM_MIX_HOME} MIX_ARCHIVES=$(pwd)/${HEXPM_MIX_HOME} mix local.rebar --force

      - name: Clone hexpm
        run: git clone --depth 1 -b ${HEXPM_BRANCH} https://github.com/hexpm/hexpm.git hexpm

      # Every matrix entry builds the same hexpm with the same OTP and Elixir,
      # so they share one entry, and only main writes it. A branch's entries
      # would only be read by that branch, and count toward the repository's
      # 10 GB cache limit along with main's.
      - name: Restore hexpm build
        id: hexpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            hexpm/deps
            hexpm/_build
          key: ${{ runner.os }}-hexpm-${{ env.HEXPM_OTP }}-${{ env.HEXPM_ELIXIR }}-${{ hashFiles('hexpm/mix.lock', 'hexpm/config/config.exs', 'hexpm/config/hex.exs') }}
          restore-keys: ${{ runner.os }}-hexpm-${{ env.HEXPM_OTP }}-${{ env.HEXPM_ELIXIR }}-

      - name: Set up hexpm
        env:
          # Compile dependencies across multiple OS processes
          # https://mix.hexdocs.pm/Mix.Tasks.Deps.Compile.html#module-compiling-dependencies-across-multiple-os-processes
          MIX_OS_DEPS_COMPILE_PARTITION_COUNT: 2
        run: |
          cd hexpm; PATH=$(pwd)/../${HEXPM_ELIXIR_PATH}/bin:$(pwd)/../${HEXPM_OTP_PATH}/bin:${PATH} MIX_HOME=$(pwd)/../${HEXPM_MIX_HOME} MIX_ARCHIVES=$(pwd)/../${HEXPM_MIX_HOME} MIX_ENV=hex ../${HEXPM_ELIXIR_PATH}/bin/mix deps.get; cd ..
          cd hexpm; PATH=$(pwd)/../${HEXPM_ELIXIR_PATH}/bin:$(pwd)/../${HEXPM_OTP_PATH}/bin:${PATH} MIX_HOME=$(pwd)/../${HEXPM_MIX_HOME} MIX_ARCHIVES=$(pwd)/../${HEXPM_MIX_HOME} MIX_ENV=hex ../${HEXPM_ELIXIR_PATH}/bin/mix compile; cd ..

      - name: Save hexpm build
        if: ${{ github.ref == 'refs/heads/main' && steps.hexpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            hexpm/deps
            hexpm/_build
          key: ${{ steps.hexpm-cache.outputs.cache-primary-key }}

      - name: Install dependencies
        run: |
          sudo rm -rf /usr/local/bin/rebar3
          mix deps.get
          mix deps.compile

      - name: Run tests
        run: mix test
